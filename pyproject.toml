[project]
name = "grok-build-harness"
version = "0.1.0"
description = "Grok-executable agentic code + toolchain harness with pure-function scientific gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "ZuluYokohama" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "rich>=13.7",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
nvidia = [
  "nvidia-ml-py>=12.0",
]

[project.scripts]
gbh = "gbh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
